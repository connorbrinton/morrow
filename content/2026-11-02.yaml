schema: 1
weeks:
- start: '2026-11-02'
  title: Jesus cares for His sheep
  assignment: Ezekiel 1–3; 33–34; 36–37; 47
  source: https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/000-contents?lang=eng
  days:
  - date: '2026-11-02'
    title: Looking for the sheep
    reference: Ezekiel 34:11-12
    scene: heart
    discover: God compared His care for His people to a shepherd looking for sheep.
    explain: A shepherd notices when a sheep is missing. Jesus Christ knows us and cares about those who
      feel lost or alone.
    younger: Make a gentle sheep sound.
    older: How can we notice when someone needs a friend?
    activity: Hide a toy sheep or another toy and find it together.
    remember: Jesus knows and cares for me.
  - date: '2026-11-03'
    title: A place to rest
    reference: Ezekiel 34:14-15
    scene: tree
    discover: Picture sheep with food, water, and a safe place to rest.
    explain: God promised to care for His scattered people. Jesus invites us to turn to Him; we can help
      others have food, rest, and care.
    younger: Pretend to be a sheep settling down.
    older: What can our family do to help someone feel cared for?
    activity: Bring someone a cup of water or help prepare a snack.
    remember: I can help care for others.
  - date: '2026-11-04'
    title: Help for the hurt
    reference: Ezekiel 34:16
    scene: heart
    discover: Listen for sheep that are lost, hurt, or sick. What will the shepherd do?
    explain: God cares about people who are struggling. We can follow Jesus by helping gently, with an
      adult’s help.
    younger: Pretend to wrap a toy’s hurt paw.
    older: What kind of help would you want if you were hurt or lonely?
    activity: Care for a stuffed animal and practice gentle words.
    remember: Jesus teaches me to care gently.
  - date: '2026-11-05'
    title: A tender heart
    reference: Ezekiel 36:26-27
    scene: heart
    discover: Ezekiel compared a hard heart to stone. God promised His people a new heart.
    explain: This is a picture using words, not a change to our body. A tender heart is willing to listen,
      love, and change. God can help us.
    younger: Make hard fists, then open gentle hands.
    older: What might it look like to have a tender heart during an argument?
    activity: Act out sharing a toy after first wanting to keep it.
    remember: God can help me become kinder.
  - date: '2026-11-06'
    title: God gives life
    reference: Ezekiel 37:5-6
    scene: tree
    discover: Ezekiel saw a vision of dry bones coming to life. It was a message of hope to discouraged
      people.
    explain: God promised to restore His people. This vision also helps us think of Jesus Christ’s Resurrection
      and His power to give life.
    younger: Take a gentle breath and wiggle your fingers.
    older: Why does Jesus’s Resurrection give our family hope?
    activity: Stand up slowly and name something you are grateful your body can do.
    remember: Jesus Christ gives us hope.
  - date: '2026-11-07'
    title: Gathered together
    reference: Ezekiel 37:21-22
    scene: heart
    discover: God promised to gather His scattered people and unite them.
    explain: God wants His people to belong together. Our family can practice unity by listening, forgiving,
      and working as a team.
    younger: Bring your hands together.
    older: How can we disagree and still be a loving family?
    activity: Build one tower together, taking turns adding pieces.
    remember: I can help our family work together.
  - date: '2026-11-08'
    title: Water that brings life
    reference: Ezekiel 47:9
    scene: tree
    discover: Ezekiel saw a vision of water flowing from the temple and bringing life.
    explain: The river is a hopeful picture of God’s life-giving blessings. We can remember Jesus and
      choose something that helps our faith grow.
    younger: Pretend your fingers are a flowing river.
    older: What helps you feel closer to Heavenly Father and Jesus?
    activity: Recall the shepherd, tender heart, and river. Each person picks a favorite.
    remember: God’s love helps us grow.
translations:
  KJV:
    Ezekiel 34:11-12: '11  For thus saith the Lord GOD ; Behold, I, even I, will both search my sheep,
      and seek them out.


      12  As a shepherd seeketh out his flock in the day that he is among his sheep that are scattered;
      so will I seek out my sheep, and will deliver them out of all places where they have been scattered
      in the cloudy and dark day.'
    Ezekiel 34:14-15: '14  I will feed them in a good pasture, and upon the high mountains of Israel shall
      their fold be: there shall they lie in a good fold, and in a fat pasture shall they feed upon the
      mountains of Israel.


      15  I will feed my flock, and I will cause them to lie down, saith the Lord GOD .'
    Ezekiel 34:16: '16  I will seek that which was lost, and bring again that which was driven away, and
      will bind up that which was broken, and will strengthen that which was sick: but I will destroy
      the fat and the strong; I will feed them with judgment.'
    Ezekiel 36:26-27: '26  A new heart also will I give you, and a new spirit will I put within you: and
      I will take away the stony heart out of your flesh, and I will give you an heart of flesh.


      27  And I will put my spirit within you, and cause you to walk in my statutes, and ye shall keep
      my judgments, and do them .'
    Ezekiel 37:5-6: '5  Thus saith the Lord GOD unto these bones; Behold, I will cause breath to enter
      into you, and ye shall live:


      6  And I will lay sinews upon you, and will bring up flesh upon you, and cover you with skin, and
      put breath in you, and ye shall live; and ye shall know that I am the LORD .'
    Ezekiel 37:21-22: '21  And say unto them, Thus saith the Lord GOD ; Behold, I will take the children
      of Israel from among the heathen, whither they be gone, and will gather them on every side, and
      bring them into their own land:


      22  And I will make them one nation in the land upon the mountains of Israel; and one king shall
      be king to them all: and they shall be no more two nations, neither shall they be divided into two
      kingdoms any more at all:'
    Ezekiel 47:9: '9  And it shall come to pass, that every thing that liveth, which moveth, whithersoever
      the rivers shall come, shall live: and there shall be a very great multitude of fish, because these
      waters shall come thither: for they shall be healed; and every thing shall live whither the river
      cometh.'
  ICB: {}
