schema: 1
weeks:
- start: '2026-10-26'
  title: God’s love brings hope
  assignment: Jeremiah 31–33; 36–38; Lamentations 1; 3
  source: https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/000-contents?lang=eng
  days:
  - date: '2026-10-26'
    title: Everlasting love
    reference: Jeremiah 31:3
    scene: heart
    discover: Listen for a word that tells how long God’s love lasts.
    explain: Everlasting means lasting forever. God’s love invites us to come closer to Him.
    younger: Open your arms wide to show love.
    older: How can remembering God’s love help after a mistake?
    activity: Tell each person, “You are loved.”
    remember: God’s love lasts.
  - date: '2026-10-27'
    title: Comfort when we are sad
    reference: Jeremiah 31:13
    scene: heart
    discover: Jeremiah spoke to people who had experienced loss. God promised comfort and joy.
    explain: We can feel sad and still be loved by God. Comfort may come through prayer, people, and time;
      sadness does not mean we did something wrong.
    younger: Show a sad face, then a comforting hug if you want one.
    older: How could we comfort someone without telling them to stop being sad?
    activity: Practice asking, “Would you like me to sit with you?”
    remember: I can give and receive comfort.
  - date: '2026-10-28'
    title: Written in our hearts
    reference: Jeremiah 31:33
    scene: heart
    discover: Can words be written in a heart? Listen for what God wanted His people to remember.
    explain: God wanted His people to know Him and treasure His teachings. We can learn to love what is
      good, rather than only obey when someone watches.
    younger: Put your hand over your heart.
    older: What good choice could you make even when nobody sees?
    activity: Choose a loving family rule and say why it matters.
    remember: I can love what is good.
  - date: '2026-10-29'
    title: God made the world
    reference: Jeremiah 32:17
    scene: tree
    discover: Jeremiah prayed about the heavens and the earth. Think of something wonderful God made.
    explain: God’s power gave Jeremiah reason to hope in a difficult time. We can thank Heavenly Father
      for His creations.
    younger: Name an animal or plant you love.
    older: What part of creation makes you feel wonder?
    activity: Take turns acting out a favorite animal.
    remember: I can thank God for His creations.
  - date: '2026-10-30'
    title: Call upon God
    reference: Jeremiah 33:3
    scene: book
    discover: God invited Jeremiah to call upon Him. We can speak to Heavenly Father in prayer.
    explain: We can bring questions and feelings to God. Answers may take time and may come through scripture,
      quiet thoughts, or other people.
    younger: Fold your arms or choose a quiet praying position.
    older: What is something you would like to ask Heavenly Father?
    activity: Each person names something to thank God for and something to ask.
    remember: I can talk with Heavenly Father.
  - date: '2026-10-31'
    title: A new morning
    reference: Lamentations 3:22-23
    scene: tree
    discover: Lamentations includes deep sadness and also words of hope. Listen for a promise about mornings.
    explain: Mercies are loving kindnesses from God. A new day gives us another chance to receive love
      and practice goodness.
    younger: Pretend to wake up and stretch.
    older: What can we do after a day that did not go well?
    activity: Practice apologizing and trying a kind action again.
    remember: I can try again today.
  - date: '2026-11-01'
    title: Hope while we wait
    reference: Lamentations 3:25-26
    scene: book
    discover: Sometimes we have to wait. This scripture speaks about hoping in the Lord.
    explain: Waiting can be hard. We can keep praying and doing good while we wait, and ask others to
      stay beside us.
    younger: Take one slow breath together.
    older: What helps you wait when something is important?
    activity: Remember a favorite lesson this week, then practice a quiet breath.
    remember: God loves me while I wait.
translations:
  KJV:
    Jeremiah 31:3: '3  The LORD hath appeared of old unto me, saying , Yea, I have loved thee with an
      everlasting love: therefore with lovingkindness have I drawn thee.'
    Jeremiah 31:13: '13  Then shall the virgin rejoice in the dance, both young men and old together:
      for I will turn their mourning into joy, and will comfort them, and make them rejoice from their
      sorrow.'
    Jeremiah 31:33: 33  But this shall be the covenant that I will make with the house of Israel; After
      those days, saith the LORD , I will put my law in their inward parts, and write it in their hearts;
      and will be their God, and they shall be my people.
    Jeremiah 32:17: '17  Ah Lord GOD ! behold, thou hast made the heaven and the earth by thy great power
      and stretched out arm, and there is nothing too hard for thee:'
    Jeremiah 33:3: 3  Call unto me, and I will answer thee, and shew thee great and mighty things, which
      thou knowest not.
    Lamentations 3:22-23: '22  It is of the LORD’s mercies that we are not consumed, because his compassions
      fail not.


      23  They are new every morning: great is thy faithfulness.'
    Lamentations 3:25-26: '25  The LORD is good unto them that wait for him, to the soul that seeketh
      him.


      26  It is good that a man should both hope and quietly wait for the salvation of the LORD .'
