schema: 1
weeks:
- start: '2026-11-09'
  title: Choose faith and courage
  assignment: Daniel 1–7
  source: https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/000-contents?lang=eng
  days:
  - date: '2026-11-09'
    title: Decide to do good
    reference: Daniel 1:8
    scene: book
    discover: Daniel lived far from home. He decided to keep his commitment to God.
    explain: Daniel made a choice before he was pressured. We can decide ahead of time to be honest, kind,
      and faithful.
    younger: Say, “I can choose kindness.”
    older: What good choice could you decide on before a hard moment?
    activity: Act out choosing honesty after spilling something.
    remember: I can decide to do good.
  - date: '2026-11-10'
    title: Ask respectfully
    reference: Daniel 1:12-13
    scene: heart
    discover: Daniel’s group asked for a test instead of starting a fight about their food.
    explain: We can speak politely when we need something different. This story is about faithfulness,
      not a promise that one food makes everyone healthier.
    younger: Practice saying, “Please may I…?”
    older: How can you disagree with someone respectfully?
    activity: Take turns asking for something in a kind voice.
    remember: I can speak with respect.
  - date: '2026-11-11'
    title: Thank God for wisdom
    reference: Daniel 2:20-22
    scene: book
    discover: Daniel thanked God for wisdom and understanding.
    explain: We can thank Heavenly Father when we learn. We can seek understanding through prayer, practice,
      and asking good questions.
    younger: Name something you learned to do.
    older: Who helps you learn, and how could you thank them?
    activity: Teach someone one small thing you know.
    remember: I can learn and give thanks.
  - date: '2026-11-12'
    title: Faith even when it is hard
    reference: Daniel 3:17-18
    scene: book
    discover: Three friends would not worship an idol. They trusted God even without knowing how things
      would turn out.
    explain: Faith does not mean we always get the outcome we want. We can choose what is right and seek
      safe help when things are hard.
    younger: Stand beside a family member like a brave friend.
    older: What good choice matters even if it does not bring a reward?
    activity: Practice saying no kindly when invited to do something unkind.
    remember: I can choose right without a reward.
  - date: '2026-11-13'
    title: Make time to pray
    reference: Daniel 6:10
    scene: book
    discover: Daniel had a habit of praying. He continued to turn to God in a difficult situation.
    explain: Prayer can be part of ordinary days, not only emergencies. We can thank Heavenly Father and
      tell Him our feelings.
    younger: Show where you like to pray.
    older: When could prayer become a helpful part of your day?
    activity: Choose a daily family prayer reminder together.
    remember: I can make time for prayer.
  - date: '2026-11-14'
    title: Help in the lions’ den
    reference: Daniel 6:21-22
    scene: heart
    discover: Daniel was put in a den of lions. In this story, God sent an angel to protect him.
    explain: Daniel’s rescue shows God’s power. Other faithful people experience harm; we can trust God’s
      love and always seek safety and trusted help.
    younger: Make a quiet lion face, then close your mouth.
    older: Who can help you when a situation is unsafe?
    activity: Name trusted adults and practice telling one, “I need help.”
    remember: I can trust God and seek help.
  - date: '2026-11-15'
    title: Jesus’s lasting kingdom
    reference: Daniel 7:13-14
    scene: heart
    discover: Daniel saw a vision of someone like the Son of man receiving a kingdom that would last.
    explain: Christians understand this vision as pointing to Jesus Christ. His kingdom welcomes people
      of every language and nation.
    younger: Open your arms in a welcoming gesture.
    older: How can we follow Jesus by welcoming someone different from us?
    activity: Each person chooses a favorite lesson and one way to follow Jesus this week.
    remember: I can follow Jesus Christ.
translations:
  KJV:
    Daniel 1:8: '8  But Daniel purposed in his heart that he would not defile himself with the portion
      of the king’s meat, nor with the wine which he drank: therefore he requested of the prince of the
      eunuchs that he might not defile himself.'
    Daniel 1:12-13: '12  Prove thy servants, I beseech thee, ten days; and let them give us pulse to eat,
      and water to drink.


      13  Then let our countenances be looked upon before thee, and the countenance of the children that
      eat of the portion of the king’s meat: and as thou seest, deal with thy servants.'
    Daniel 2:20-22: '20  Daniel answered and said, Blessed be the name of God for ever and ever: for wisdom
      and might are his:


      21  And he changeth the times and the seasons: he removeth kings, and setteth up kings: he giveth
      wisdom unto the wise, and knowledge to them that know understanding:


      22  He revealeth the deep and secret things: he knoweth what is in the darkness, and the light dwelleth
      with him.'
    Daniel 3:17-18: '17  If it be so , our God whom we serve is able to deliver us from the burning fiery
      furnace, and he will deliver us out of thine hand, O king.


      18  But if not, be it known unto thee, O king, that we will not serve thy gods, nor worship the
      golden image which thou hast set up.'
    Daniel 6:10: 10  Now when Daniel knew that the writing was signed, he went into his house; and his
      windows being open in his chamber toward Jerusalem, he kneeled upon his knees three times a day,
      and prayed, and gave thanks before his God, as he did aforetime.
    Daniel 6:21-22: '21  Then said Daniel unto the king, O king, live for ever.


      22  My God hath sent his angel, and hath shut the lions’ mouths, that they have not hurt me: forasmuch
      as before him innocency was found in me; and also before thee, O king, have I done no hurt.'
    Daniel 7:13-14: '13  I saw in the night visions, and, behold, one like the Son of man came with the
      clouds of heaven, and came to the Ancient of days, and they brought him near before him.


      14  And there was given him dominion, and glory, and a kingdom, that all people, nations, and languages,
      should serve him: his dominion is an everlasting dominion, which shall not pass away, and his kingdom
      that which shall not be destroyed.'
