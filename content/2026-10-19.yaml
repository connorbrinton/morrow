schema: 1
weeks:
- start: '2026-10-19'
  title: God knows and helps me
  assignment: Jeremiah 1–3; 7; 16–18; 20
  source: https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/000-contents?lang=eng
  days:
  - date: '2026-10-19'
    title: God knows me
    reference: Jeremiah 1:4-5
    scene: heart
    discover: Jeremiah was called to be a prophet. Before he was born, God knew him.
    explain: God knew Jeremiah before his birth. We believe each of us is a beloved child of Heavenly
      Father.
    younger: Point to yourself and say, “God knows me.”
    older: What does it mean to you that God knows you?
    activity: Say one thing you love about each person in your family.
    remember: Heavenly Father knows and loves me.
  - date: '2026-10-20'
    title: Help when I feel small
    reference: Jeremiah 1:6-8
    scene: book
    discover: Jeremiah worried that he was too young to speak for God. Listen for God’s answer.
    explain: God did not ask Jeremiah to do his work alone. We can pray for help and ask trusted people
      to help us.
    younger: Show how you look when you feel nervous.
    older: When have you needed help to do something difficult?
    activity: Practice saying, “Can you help me?” and offering help to each other.
    remember: I can ask for help.
  - date: '2026-10-21'
    title: Make room for others
    reference: Jeremiah 7:5-7
    scene: heart
    discover: Jeremiah taught people that worship should change how they treat others.
    explain: A stranger is someone new to a place. Jeremiah asked people to be fair and care for those
      who needed help. Following Jesus includes kindness.
    younger: Pretend to invite someone to sit beside you.
    older: How can we help a child who is new or left out?
    activity: Act out inviting someone to join a game.
    remember: I can include someone.
  - date: '2026-10-22'
    title: God is my refuge
    reference: Jeremiah 16:19
    scene: book
    discover: A refuge is a safe place. Jeremiah used that word to describe the Lord.
    explain: We can turn to God when we are afraid. We can also go to safe adults who love and protect
      us.
    younger: Name a grown-up who helps you feel safe.
    older: What could you say in a prayer when you feel afraid?
    activity: Make a cozy shelter with your arms and talk about people who help you.
    remember: I can turn to God and trusted helpers.
  - date: '2026-10-23'
    title: Roots by the water
    reference: Jeremiah 17:7-8
    scene: tree
    discover: Imagine a tree beside a stream. What helps it keep growing?
    explain: Jeremiah compared trusting the Lord to a tree with roots near water. Prayer and following
      Jesus can help us keep growing through hard days.
    younger: Stretch your arms like branches.
    older: What might be like water for our faith?
    activity: Pretend to be trees with deep roots while a gentle wind blows.
    remember: I can grow as I trust the Lord.
  - date: '2026-10-24'
    title: The potter’s clay
    reference: Jeremiah 18:3-6
    scene: book
    discover: Jeremiah watched a potter shaping clay. A potter can reshape a pot that needs work.
    explain: God used the potter’s work to teach His people. We can let God help us change by listening,
      repenting, and trying again.
    younger: Pretend to squeeze a ball of clay.
    older: What is one good change you want help making?
    activity: Shape play dough or pretend clay. Reshape it together.
    remember: God can help me change and grow.
  - date: '2026-10-25'
    title: Remember our roots
    reference: Jeremiah 17:7-8
    scene: tree
    discover: Today we return to the tree beside the water. What do you remember?
    explain: Trusting God is something we practice. We can pray, listen, and choose kindness one small
      step at a time.
    younger: Show your tree branches again.
    older: Which idea from this week would you like to practice?
    activity: Each person chooses a kind action for the coming week.
    remember: Our family can grow together.
translations:
  KJV:
    Jeremiah 1:4-5: '4  Then the word of the LORD came unto me, saying,


      5  Before I formed thee in the belly I knew thee; and before thou camest forth out of the womb I
      sanctified thee, and I ordained thee a prophet unto the nations.'
    Jeremiah 1:6-8: '6  Then said I, Ah, Lord GOD ! behold, I cannot speak: for I am a child.


      7  But the LORD said unto me, Say not, I am a child: for thou shalt go to all that I shall send
      thee, and whatsoever I command thee thou shalt speak.


      8  Be not afraid of their faces: for I am with thee to deliver thee, saith the LORD .'
    Jeremiah 7:5-7: '5  For if ye throughly amend your ways and your doings; if ye throughly execute judgment
      between a man and his neighbour;


      6  If ye oppress not the stranger, the fatherless, and the widow, and shed not innocent blood in
      this place, neither walk after other gods to your hurt:


      7  Then will I cause you to dwell in this place, in the land that I gave to your fathers, for ever
      and ever.'
    Jeremiah 16:19: 19  O LORD , my strength, and my fortress, and my refuge in the day of affliction,
      the Gentiles shall come unto thee from the ends of the earth, and shall say, Surely our fathers
      have inherited lies, vanity, and things wherein there is no profit.
    Jeremiah 17:7-8: '7  Blessed is the man that trusteth in the LORD , and whose hope the LORD is.


      8  For he shall be as a tree planted by the waters, and that spreadeth out her roots by the river,
      and shall not see when heat cometh, but her leaf shall be green; and shall not be careful in the
      year of drought, neither shall cease from yielding fruit.'
    Jeremiah 18:3-6: '3  Then I went down to the potter’s house, and, behold, he wrought a work on the
      wheels.


      4  And the vessel that he made of clay was marred in the hand of the potter: so he made it again
      another vessel, as seemed good to the potter to make it .


      5  Then the word of the LORD came to me, saying,


      6  O house of Israel, cannot I do with you as this potter? saith the LORD . Behold, as the clay
      is in the potter’s hand, so are ye in mine hand, O house of Israel.'
  ICB: {}
